# Makes this repo a reusable GitHub Action. A client's workflow references it as
# `uses: zenikhq/zenik-action@v1` — GitHub fetches this repo at run time and runs
# the steps below with the CLIENT's repo already checked out.
#
# The agent runs HERE, on the client's runner, driven by the client's own API
# key. Source code never leaves the runner: the diff is embedded locally and only
# vectors are sent to zenik-platform.
name: "Zenik — change impact"
description: "Computes the blast radius of a pull request and posts findings back on the PR."

inputs:
  zenik-platform-url:
    description: "Base URL of zenik-platform (the blast-radius API)."
    required: true

  zenik-client-key:
    description: >
      The client's Zenik machine credential. Authenticates this repo to the
      platform. Passed as a step input rather than a job-level env var so
      repository-controlled code in the same job cannot read it.
    required: true

  github-token:
    description: >
      The client's own GITHUB_TOKEN. Used to post the impact comment and check.
      Zenik has no GitHub identity — everything appears as the client's own
      github-actions[bot], in the client's own repo.
    required: false
    default: ${{ github.token }}

  openai-api-key:
    description: >
      The client's OpenAI key. Selects the Codex agent backend, and enables the
      semantic half of the blast radius (embeddings are computed on this runner).
      Without it the impact set comes from import/reference edges only.
    required: false
    default: ""

  anthropic-api-key:
    description: "The client's Anthropic key. Selects the Claude Code backend."
    required: false
    default: ""

  agent-backend:
    description: "'codex' or 'claude-code'. Defaults to whichever key is set (codex if both)."
    required: false
    default: ""

  agent-model:
    description: "Optional model override passed through to the agent CLI."
    required: false
    default: ""

  agent-timeout-seconds:
    description: "Wall-clock limit for the agent run."
    required: false
    default: "900"

outputs:
  outcome:
    description: "findings_reported | no_impact_found | no_symbols_changed | agent_failed | platform_unreachable"
    value: ${{ steps.zenik.outputs.outcome }}
  affected-sites:
    description: "Number of sites in the computed blast radius."
    value: ${{ steps.zenik.outputs.affected-sites }}
  cross-service:
    description: "How many of those cross a language/service boundary."
    value: ${{ steps.zenik.outputs.cross-service }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Agent CLIs are distributed via npm; Python drives them.
    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    # tree-sitter grammars are downloaded on demand and cached. Warming them
    # here keeps the index step off the network and makes a grammar-download
    # failure a clear, early error rather than a confusing mid-run one.
    - name: Warm tree-sitter grammar cache
      shell: bash
      run: |
        python - <<'PY'
        import sys
        sys.path.insert(0, "${{ github.action_path }}/vendor")
        from zenik_indexer.langs import prefetch_languages
        common = ["python","javascript","typescript","tsx","go","java","ruby",
                  "rust","c","cpp","csharp","php","kotlin","swift","scala"]
        for lang, ok in prefetch_languages(common).items():
            print(f"  {'ok  ' if ok else 'MISS'} {lang}")
        PY

    # Codex's Linux sandbox uses bubblewrap, which needs an unprivileged user
    # namespace. On Ubuntu 24.04 — what ubuntu-latest runners are — AppArmor
    # blocks that unless the bwrap-userns-restrict profile is loaded, and bwrap
    # then fails every command with "Failed RTM_NEWADDR: Operation not
    # permitted". This is the fix OpenAI documents rather than a workaround: it
    # keeps the agent properly sandboxed instead of resorting to
    # --sandbox danger-full-access.
    #
    # Every command tolerates failure: on a runner where this isn't needed the
    # setup is skipped and the agent still runs. If the sandbox genuinely can't
    # start, the agent step fails explicitly rather than running unsandboxed.
    # Only relevant to Codex — a Claude Code caller should not pay for an
    # apt-get they will never use.
    - name: Prepare Linux sandbox for the agent
      if: >-
        inputs.agent-backend == 'codex' ||
        (inputs.agent-backend == '' && inputs.openai-api-key != '')
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "[sandbox-setup] not Linux; nothing to do"; exit 0
        fi
        if ! command -v sudo >/dev/null 2>&1; then
          echo "[sandbox-setup] no sudo available; skipping"; exit 0
        fi

        echo "[sandbox-setup] installing bubblewrap + apparmor profiles"
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils || true

        PROFILE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        if [ -f "$PROFILE" ]; then
          sudo install -m 0644 "$PROFILE" /etc/apparmor.d/bwrap-userns-restrict || true
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict || true
        fi

        if command -v bwrap >/dev/null 2>&1; then
          if bwrap --unshare-all --dev-bind / / /bin/true 2>/dev/null; then
            echo "[sandbox-setup] OK — bubblewrap can create a user namespace"
          else
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            bwrap --unshare-all --dev-bind / / /bin/true 2>/dev/null \
              && echo "[sandbox-setup] OK after sysctl adjustment" \
              || echo "[sandbox-setup] sandbox unavailable; the agent step will fail rather than run unsandboxed"
          fi
        fi

    - name: Compute change impact
      id: zenik
      shell: bash
      env:
        ZENIK_PLATFORM_URL: ${{ inputs.zenik-platform-url }}
        ZENIK_CLIENT_KEY: ${{ inputs.zenik-client-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AGENT_BACKEND: ${{ inputs.agent-backend }}
        AGENT_MODEL: ${{ inputs.agent-model }}
        AGENT_TIMEOUT_SECONDS: ${{ inputs.agent-timeout-seconds }}
        ZENIK_NO_DOTENV: "1"
      run: python ${{ github.action_path }}/zenik_pr.py
